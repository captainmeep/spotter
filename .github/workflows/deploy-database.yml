name: Deploy database

# Applies new database migrations to the live Supabase project whenever they
# reach main. Until the Supabase secrets are added (see DEPLOY.md), it skips
# with a notice instead of failing. Run it by hand from the Actions tab the
# first time you set up the live database.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to the live database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check the Supabase secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::The Supabase secrets aren't set yet, so the live database wasn't changed. See DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      # Linking connects through Supabase's connection pooler, which works over
      # IPv4. GitHub's runners can't reach the database's direct IPv6 address.
      - name: Link the Supabase project
        if: steps.secrets.outputs.ready == 'true'
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show which migrations will be applied
        if: steps.secrets.outputs.ready == 'true'
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
