# Builds the app image and the tools image, and pushes both to Artifact
# Registry. Used by scripts/deploy-gcp.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "run", "-t", "${_REPO}/app:${_TAG}", "-t", "${_REPO}/app:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "tools", "-t", "${_REPO}/tools:${_TAG}", "-t", "${_REPO}/tools:latest", "."]
images:
  - ${_REPO}/app:${_TAG}
  - ${_REPO}/app:latest
  - ${_REPO}/tools:${_TAG}
  - ${_REPO}/tools:latest
substitutions:
  _REPO: us-west1-docker.pkg.dev/spotter-513202/spotter
  _TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
